
name: Deploy RepEAT Web App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check RepEAT ZIP
        run: |
          if [ ! -f "RepEAT-last.zip" ]; then
            echo "ERROR: RepEAT-last.zip tidak ditemukan!"
            ls -lah
            exit 1
          fi

          if ! unzip -tq RepEAT-last.zip; then
            echo "ERROR: ZIP tidak valid atau rusak!"
            exit 1
          fi

          echo "ZIP berhasil diperiksa!"

      - name: Extract RepEAT project
        run: |
          mkdir -p extracted
          unzip -q RepEAT-last.zip -d extracted

          echo "Mencari folder www..."

          INDEX_FILE=$(find extracted -type f -path '*/www/index.html' | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: www/index.html tidak ditemukan!"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          WEB_DIR=$(dirname "$INDEX_FILE")

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo "Website ditemukan di: $WEB_DIR"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web App
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WEB_DIR }}

      - name: Publish Web App
        id: deployment
        uses: actions/deploy-pages@v4
