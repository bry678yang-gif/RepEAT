
name: Build RepEAT APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Diagnose RepEAT ZIP
        run: |
          echo "=== FILE INFORMATION ==="
          ls -lah RepEAT-last.zip
      
          echo "=== FILE TYPE ==="
          file RepEAT-last.zip
      
          echo "=== FIRST 100 BYTES ==="
          head -c 100 RepEAT-last.zip | xxd
      
          echo "=== ZIP VALIDATION ==="
          unzip -t RepEAT-last.zip
      
          echo "=== END DIAGNOSTIC ==="

      - name: Install Android dependencies
        run: npm run android:setup
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          java -version
          javac -version
          ./gradlew --no-daemon --max-workers=2 assembleDebug

      - name: Upload RepEAT APK
        uses: actions/upload-artifact@v4
        with:
          name: RepEAT-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
