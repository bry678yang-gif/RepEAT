
name: Build RepEAT APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Check and Extract RepEAT ZIP
        run: |
          echo "Checking ZIP file..."

          if [ ! -f "RepEAT-last.zip" ]; then
            echo "ERROR: RepEAT-last.zip tidak ditemukan!"
            echo "File yang tersedia:"
            ls -lah
            exit 1
          fi

          file RepEAT-last.zip
          ls -lh RepEAT-last.zip

          if ! unzip -tq RepEAT-last.zip; then
            echo "ERROR: RepEAT-last.zip bukan ZIP valid atau rusak."
            exit 1
          fi

          mkdir -p extracted
          unzip -q RepEAT-last.zip -d extracted

          if [ -f extracted/kantong-kejutan/package.json ]; then
            PROJECT_DIR="extracted/kantong-kejutan"
          elif [ -f extracted/package.json ]; then
            PROJECT_DIR="extracted"
          else
            echo "ERROR: package.json tidak ditemukan."
            find extracted -maxdepth 3 -type f | head -50
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "RepEAT berhasil diekstrak!"

      - name: Install Android dependencies
        run: npm run android:setup
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          java -version
          javac -version
          ./gradlew --no-daemon --max-workers=2 assembleDebug

      - name: Upload RepEAT APK
        uses: actions/upload-artifact@v4
        with:
          name: RepEAT-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
