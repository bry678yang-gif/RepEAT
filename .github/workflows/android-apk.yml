
name: Build RepEAT APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract latest RepEAT
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'RepEAT-GitHub-Ready*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP RepEAT tidak ditemukan!"
            ls -lah
            exit 1
          fi

          echo "Menggunakan file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/kantong-kejutan/package.json


      - name: Install Android dependencies
        working-directory: extracted/kantong-kejutan
        run: npm run android:setup

      - name: Configure Maven mirrors
        working-directory: extracted/kantong-kejutan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/build.gradle"),
              Path("android/settings.gradle"),
          ]

          mirrors = {
              "google()": "https://maven.aliyun.com/repository/google",
              "mavenCentral()": "https://maven.aliyun.com/repository/central",
          }

          for path in files:
              if not path.exists():
                  continue

              content = path.read_text()

              for original, url in mirrors.items():
                  pattern = re.compile(
                      r"(?m)^(\s*)" + re.escape(original) + r"\s*$"
                  )

                  def replace(match):
                      indent = match.group(1)
                      return (
                          indent + "maven { url '" + url + "' }\n"
                          + indent + original
                      )

                  content = pattern.sub(replace, content)

              path.write_text(content)

          print("Maven mirrors configured.")
          PY

      - name: Build Android APK
        working-directory: extracted/kantong-kejutan/android
        run: |
          chmod +x gradlew
          java -version
          javac -version

          for attempt in 1 2 3; do
            echo "Build attempt $attempt"

            ./gradlew --no-daemon --max-workers=2 assembleDebug && exit 0

            echo "Build failed. Retrying in 30 seconds..."
            sleep 30
          done

          exit 1

      - name: Upload RepEAT APK
        uses: actions/upload-artifact@v4
        with:
          name: RepEAT-APK
          path: extracted/kantong-kejutan/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
