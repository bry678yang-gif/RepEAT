
name: Build RepEAT APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project ZIP
        run: |
          unzip -q RepEAT-GitHub-Ready.zip -d extracted
          test -f extracted/kantong-kejutan/package.json

      - name: Install and setup Android
        working-directory: extracted/kantong-kejutan
        run: npm run android:setup

      - name: Add Maven mirror
        working-directory: extracted/kantong-kejutan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/build.gradle")
          s = p.read_text()

          mirror = 'maven { url "https://maven.aliyun.com/repository/central" }'

          s = re.sub(
              r'(?m)^(\s*)mavenCentral\(\)\s*$',
              lambda m: f'{m.group(1)}{mirror}\n{m.group(1)}mavenCentral()',
              s
          )

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: extracted/kantong-kejutan/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RepEAT-APK
          path: extracted/kantong-kejutan/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
