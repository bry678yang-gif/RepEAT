
name: Build RepEAT APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4


      - name: Extract RepEAT ZIP
        run: |
          mkdir -p extracted
          unzip -q RepEAT-last.zip -d extracted

          echo "=== MENCARI PACKAGE.JSON ==="
          find extracted -name package.json -type f

          PROJECT_FILE=$(find extracted -name package.json -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: package.json tidak ditemukan!"
            find extracted -maxdepth 4 -type d
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan di: $PROJECT_DIR"


      - name: Install Android dependencies
        run: npm run android:setup
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug

      - name: Upload RepEAT APK
        uses: actions/upload-artifact@v4
        with:
          name: RepEAT-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
